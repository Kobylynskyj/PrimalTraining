{% extends "base/base.html" %}
{%load static%}

{% block main %}
<section class="reserve-section">
        <h1 class="reserve-title">BOOK A <span>SESSION</span></h1>
        <h2 class="reserve-subtitle">Available Classes</h2>

    <div class="reserve-grid">

        {% for item in classes %}
            <div class="card">
                <h3 class="class-item">{{item.title}}</h3>
                <p class="class-description">{{item.description}}</p>
                <p class="class-price">{{item.price}}kc</p>
                <p class="class-capacity"><strong>Places:</strong> {{ item.max_capacity }}</p>
                    <button type="submit" class="reserve-btn">RESERVE YOUR SPOT</button>
            </div>
            {%empty%}
                <p class="no-classes">No available classes at the moment.</p>
        {% endfor %}

    </div>
</section>
{% endblock main %}
